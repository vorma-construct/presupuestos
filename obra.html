<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cómo va mi obra</title>
<meta name="robots" content="noindex">
<link rel="manifest" id="manif" href="obra.webmanifest">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--crema:#FBF8F1;--ink:#1c1f22;--slate:#111214;--oro:#A87B18;--oro2:#C99A2E;--line:#e2dccf;--muted:#6b7178;--verde:#1a7a3f;--rojo:#B3261E;--naranja:#C24A00}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{background:var(--slate);color:#fff;padding:18px 18px 22px}
header .logo{height:64px;display:block;margin-bottom:10px}
header .marca{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--oro2);font-weight:700}
header h1{font-size:24px;margin:6px 0 2px;line-height:1.1}
header .sub{font-size:14px;color:#cfc8ba}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-size:18px;margin:0 0 4px}
.barra{height:10px;background:#e7e1d4;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--oro2),var(--oro));width:0;transition:width 1.2s ease}
.barra__txt{font-size:13px;color:var(--muted)}
.fases{list-style:none;padding:0;margin:8px 0 0}
.fases li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.fases li:last-child{border-bottom:0}
.fases li span{width:24px;height:24px;border-radius:50%;background:#e7e1d4;color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.fases li em{margin-left:auto;font-style:normal;font-size:12px;color:#9aa0a6;flex:none}
.fases li.ok{color:var(--ink)}.fases li.ok span{background:var(--verde);color:#fff}
.fases li.ahora{color:var(--ink);font-weight:700}.fases li.ahora span{background:var(--oro);color:#fff}
.dia{font-weight:700;font-size:14px;margin:20px 0 8px;padding-left:22px;position:relative;color:var(--ink)}
.dia:before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--oro);border:3px solid var(--crema);box-shadow:0 0 0 1px var(--line)}
.dia small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.foto{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.foto img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#eee}
.foto .pie{padding:10px 14px;font-size:14px;color:var(--ink)}
.foto.imp{border:2px solid var(--naranja)}
.foto .cab{background:var(--naranja);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;letter-spacing:.3px}
.decide{padding:12px 14px 14px;background:#FFF7EE;border-top:1px solid #f1d9c4}
.decide .precio{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.decide .precio b{font-size:20px}
.decide .btns{display:flex;gap:10px}
.decide .btns button{flex:1;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.decide .no{background:#fff;border:1px solid #d5cfc2!important;color:#5c6168}
.decide .si{background:var(--verde);color:#fff}
.decide .resp{font-size:14px;font-weight:700;padding:6px 0}
.decide .resp.ok{color:var(--verde)}.decide .resp.ko{color:var(--rojo)}
.decide .aviso{font-size:12px;color:var(--muted);margin-top:6px}
.vacio{text-align:center;padding:28px 16px;color:var(--muted)}
.vacio .ico{font-size:40px;margin-bottom:6px}
.vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.acciones{display:flex;gap:10px;margin:18px 0}
.acciones a,.acciones button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.tel{background:var(--oro);color:#fff}
.guardar{background:#fff;border:1px solid var(--line)!important;color:var(--ink)}
.lopd{font-size:12px;color:var(--muted);line-height:1.45;margin-top:14px}
.aviso-imp{background:#FFF4E5;border-left:4px solid var(--naranja);padding:10px 12px;border-radius:8px;font-size:13px;margin:6px 0 14px}
.instalar{display:none;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.instalar.on{display:flex}
.instalar img{width:40px;height:40px;border-radius:10px;flex:none}
.instalar div{flex:1;font-size:14px}.instalar b{display:block}
.instalar button{background:var(--oro);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;flex:none;font-family:inherit}
.avisos{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;align-items:center;gap:10px}
.avisos.on{display:flex}.avisos button{background:#fff;border:1px solid var(--oro)!important;color:var(--oro);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;flex:none;font-family:inherit}
.nuevo{background:var(--verde);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.firma{text-align:center;font-size:12px;color:#9aa0a6;margin-top:22px}
@media print{header{-webkit-print-color-adjust:exact;print-color-adjust:exact}.acciones,.decide .btns{display:none!important}.foto{break-inside:avoid}body{background:#fff}}
</style></head><body>
<header>
  <img src="icons/logo.svg" alt="" class="logo" onerror="this.style.display='none'">
  <div class="marca" id="hMarca">Cómo va mi obra</div>
  <h1 id="hTit">Tu obra</h1>
  <div class="sub" id="hSub"></div>
</header>
<div class="wrap">
  <div class="card" id="avance" style="display:none">
    <h2>Avance de la obra</h2>
    <div class="barra"><i id="barraI"></i></div>
    <div class="barra__txt" id="barraTxt"></div>
    <ul class="fases" id="fases"></ul>
  </div>
  <div class="instalar" id="instalar"><img src="icons/icon-192.png" alt=""><div><b>Tenga su obra en el móvil</b>Instálela como una app y ábrala de un toque.</div><button type="button" id="btnInstalar">Instalar</button></div>
<div class="avisos" id="avisos"><div style="flex:1"><b>¿Le avisamos de las novedades?</b><br>Cuando subamos una foto o aparezca algo, le llega un aviso al móvil.</div><button type="button" id="btnAvisos">Sí, avisadme</button></div>
<div id="cont" class="vacio"><div class="ico">⏳</div>Cargando su obra…</div>
  <div class="acciones" id="acciones" style="display:none">
    <a class="tel" id="btnTel" href="#">Llamar</a>
    <button class="guardar" onclick="window.print()">Guardar diario</button>
  </div>
  <div class="lopd" id="lopd2"></div>
  <div class="firma" id="firma"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var CFG={apiKey:"AIzaSyDsUvYWlJUPa__voQ7oBznCDWb8o6D1m5Q",authDomain:"reformas-ioan.firebaseapp.com",projectId:"reformas-ioan",storageBucket:"reformas-ioan.firebasestorage.app",messagingSenderId:"65105142083",appId:"1:65105142083:web:cfcb082d4406f938c60ff6"};
firebase.initializeApp(CFG);var db=firebase.firestore();
var TOK=new URLSearchParams(location.search).get('t');
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function fechaLarga(s){try{return new Date(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}catch(e){return ''}}
function fechaCorta(s){try{return new Date(s).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}catch(e){return ''}}
function responder(id,resp,btn){
  var txt=resp==='aceptado'?'¿Confirma que quiere que lo arreglemos? El importe se suma a su presupuesto.':'¿Lo dejamos sin hacer por ahora?';
  if(!confirm(txt))return;
  var caja=btn.closest('.decide');caja.innerHTML='<div class="aviso">Guardando su respuesta…</div>';
  db.collection('seguimiento').doc(TOK).collection('fotos').doc(id).update({respuesta:resp,fechaRespuesta:new Date().toISOString()})
  .then(function(){caja.innerHTML=resp==='aceptado'?'<div class="resp ok">✓ Aprobado. Se lo hemos comunicado al equipo.</div>':'<div class="resp ko">✗ Anotado: no se hace por ahora.</div>'})
  .catch(function(e){caja.innerHTML='<div class="resp ko">No se ha podido guardar ('+esc(e.message)+'). Llámenos y lo apuntamos nosotros.</div>'});
}
function pintarFases(d){
  var total=+d.total||0,hechas=+d.hechas||0;var f=d.fases||[];
  if(!total&&!f.length)return;
  document.getElementById('avance').style.display='';
  var pct=Math.round(hechas*100/Math.max(1,total));
  setTimeout(function(){document.getElementById('barraI').style.width=pct+'%'},60);
  document.getElementById('barraTxt').textContent=pct+' % de la obra hecha · '+hechas+' de '+total+' trabajos';
  var h='',primeraPend=-1;
  f.forEach(function(x,i){if(!x.hecha&&primeraPend<0)primeraPend=i});
  f.forEach(function(x,i){var cls=x.hecha?'ok':(i===primeraPend?'ahora':'');
    h+='<li class="'+cls+'"><span>'+(x.hecha?'✓':(i+1))+'</span>'+esc(x.d)+'<em>'+(x.hecha?'hecho':(i===primeraPend?'en curso':'pendiente'))+'</em></li>'});
  document.getElementById('fases').innerHTML=h;
}
if(!TOK){document.getElementById('cont').innerHTML='<div class="ico">🔗</div><b>Enlace incompleto</b>Pida que se lo manden otra vez.';}
else{
db.collection('seguimiento').doc(TOK).get().then(function(s){
  var d=s.exists?s.data():{};window.__d=d;
  if(d.redirige&&d.redirige!==TOK){location.replace('obra.html?t='+encodeURIComponent(d.redirige));return}
  document.getElementById('hMarca').textContent=d.marca||'Cómo va mi obra';
  document.getElementById('hTit').textContent=d.cliente?'Tu obra, '+String(d.cliente).split(' ')[0]:'Tu obra';
  document.getElementById('hSub').textContent=d.obra||'';
  pintarFases(d);
  document.getElementById('lopd2').innerHTML='<b>Protección de datos.</b> Estas fotos son del seguimiento de su obra y las trata '+esc(d.marca||'el contratista')+' solo para informárselo a usted. El enlace es privado: no lo comparta si no quiere que otras personas lo vean. Puede pedir que se borren escribiendo o llamando al contratista.';
  if(d.tel){var a=document.getElementById('btnTel');a.href='tel:'+String(d.tel).replace(/\s/g,'');a.textContent='Llamar al '+d.tel;document.getElementById('acciones').style.display='flex'}
  document.getElementById('firma').textContent=(d.marca||'')+(d.responsable?' · '+d.responsable:'');
  db.collection('seguimiento').doc(TOK).collection('fotos').orderBy('ts','asc').onSnapshot(function(q){pintarFotos(q);avisarNuevas(q)},function(e){document.getElementById('cont').innerHTML='<div class="ico">⚠️</div><b>No he podido abrir el seguimiento</b>'+esc(e.message)});
  db.collection('seguimiento').doc(TOK).onSnapshot(function(s2){if(s2.exists)pintarFases(s2.data())});
}).catch(function(e){document.getElementById('cont').innerHTML='<div class="ico">⚠️</div><b>No he podido abrir el seguimiento</b>'+esc(e.message)});
}
function pintarFotos(q){
  var cont=document.getElementById('cont');
  if(!q||q.empty){cont.className='vacio';cont.innerHTML='<div class="ico">📷</div><b>Todavía no hay fotos</b>En cuanto empecemos, cada día verá aquí una foto de cómo va su casa.';return}
  var html='',dia='',nImp=0,nDias=0;
  q.forEach(function(doc){var f=doc.data();
    var d=fechaLarga(f.fecha||f.ts);
    if(d!==dia){dia=d;nDias++;html+='<div class="dia">'+d+'<small>Día '+nDias+'</small></div>'}
    var imp=(f.tipo==='imprevisto');if(imp)nImp++;
    var dec='';
    if(imp&&f.precio!=null){
      var pr=Number(f.precio).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
      if(f.respuesta==='aceptado')dec='<div class="decide"><div class="precio"><span>Arreglarlo</span><b>'+pr+' + IVA</b></div><div class="resp ok">✓ Aprobado por usted'+(f.fechaRespuesta?' el '+fechaCorta(f.fechaRespuesta):'')+'</div></div>';
      else if(f.respuesta==='rechazado')dec='<div class="decide"><div class="precio"><span>Arreglarlo</span><b>'+pr+' + IVA</b></div><div class="resp ko">✗ Ha decidido no hacerlo por ahora</div><div class="aviso">Si cambia de idea, llámenos y lo retomamos.</div></div>';
      else dec='<div class="decide"><div class="precio"><span>Arreglarlo cuesta</span><b>'+pr+' + IVA</b></div><div class="btns"><button class="no" onclick="responder(\''+doc.id+'\',\'rechazado\',this)">Ahora no</button><button class="si" onclick="responder(\''+doc.id+'\',\'aceptado\',this)">Adelante</button></div><div class="aviso">No se toca nada hasta que usted decida. Si acepta, este importe se suma a su presupuesto y queda por escrito.</div></div>';
    }else if(imp){dec='<div class="decide"><div class="aviso">Estamos valorando lo que cuesta. Se lo pondremos aquí con su precio para que decida usted.</div></div>'}
    var nuevo=(f.ts&&f.ts>ultimoVisto())?'<span class="nuevo">NUEVO</span>':'';
    html+='<div class="foto'+(imp?' imp':'')+'">'+(imp?'<div class="cab">⚠️ Algo no previsto en la obra</div>':'')+(f.img?'<img src="'+f.img+'" loading="lazy" alt="">':'')+((f.nota||nuevo)?'<div class="pie">'+esc(f.nota)+nuevo+'</div>':'')+dec+'</div>';
  });
  cont.className='';
  cont.innerHTML=(nImp?'<div class="aviso-imp"><b>Sobre lo no previsto.</b> Lo marcado en naranja ha aparecido al abrir la obra y no estaba en el presupuesto. Se le enseña con su precio para que decida usted: no se hace nada sin su aprobación.</div>':'')+html;
}
/* ---- lo ultimo que vio el cliente, para marcar NUEVO ---- */
function ultimoVisto(){try{return +localStorage.getItem('visto_'+TOK)||0}catch(e){return 0}}
function marcarVisto(ts){try{localStorage.setItem('visto_'+TOK,String(ts))}catch(e){}}
var __primera=true;
function avisarNuevas(q){var max=0,nuevas=[];q.forEach(function(d){var f=d.data();if(f.ts>max)max=f.ts;if(f.ts>ultimoVisto())nuevas.push(f)});
  if(!__primera&&nuevas.length&&window.Notification&&Notification.permission==='granted'){
    var f=nuevas[nuevas.length-1];var t=f.tipo==='imprevisto'?'Algo no previsto en su obra':'Nueva foto de su obra';
    var c=(f.nota||'')+(f.precio!=null?' · '+Number(f.precio).toLocaleString('es-ES')+' € + IVA':'');
    try{navigator.serviceWorker.getRegistration().then(function(r){if(r)r.showNotification(t,{body:c,icon:'icons/icon-192.png',badge:'icons/icon-96.png',tag:'obra-'+TOK,data:{url:location.href}});else new Notification(t,{body:c,icon:'icons/icon-192.png'})})}catch(e){}
  }
  __primera=false;
  // al cabo de unos segundos en pantalla, se da por visto
  setTimeout(function(){if(max)marcarVisto(max)},8000);
}
/* ---- instalar como app y pedir avisos ---- */
var __instEvt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();__instEvt=e;document.getElementById('instalar').classList.add('on')});
document.getElementById('btnInstalar').onclick=function(){if(__instEvt){__instEvt.prompt();__instEvt.userChoice.then(function(){document.getElementById('instalar').classList.remove('on');__instEvt=null})}
  else alert('En Chrome: menú (⋮) → «Añadir a pantalla de inicio». En Safari: compartir → «Añadir a pantalla de inicio».')};
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.getElementById('instalar').classList.remove('on');
if(window.Notification&&Notification.permission==='default')document.getElementById('avisos').classList.add('on');
document.getElementById('btnAvisos').onclick=function(){Notification.requestPermission().then(function(p){document.getElementById('avisos').classList.remove('on');if(p==='granted')try{navigator.serviceWorker.getRegistration().then(function(r){if(r)r.showNotification('Avisos activados',{body:'Le avisaremos cuando haya novedades en su obra.',icon:'icons/icon-192.png',tag:'obra-ok'})})}catch(e){}})};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw-obra.js').catch(function(){});
/* el manifiesto se genera con el enlace de esta obra, para que el icono instalado abra directamente su obra */
try{if(TOK){var man={name:'Mi obra · '+(document.getElementById('hMarca').textContent||'Vorma Construct'),short_name:'Mi obra',start_url:location.pathname+'?t='+encodeURIComponent(TOK),scope:location.pathname.replace(/[^/]*$/,''),display:'standalone',background_color:'#111214',theme_color:'#111214',
icons:[{src:location.origin+location.pathname.replace(/[^/]*$/,'')+'icons/icon-192.png',sizes:'192x192',type:'image/png'},{src:location.origin+location.pathname.replace(/[^/]*$/,'')+'icons/icon-512.png',sizes:'512x512',type:'image/png'},{src:location.origin+location.pathname.replace(/[^/]*$/,'')+'icons/icon-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
document.getElementById('manif').setAttribute('href','data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man)))}}catch(e){}
/* si se abre el icono sin obra, recuerda la ultima */
try{if(TOK)localStorage.setItem('ultima_obra',TOK);else{var u=localStorage.getItem('ultima_obra');if(u)location.replace('obra.html?t='+encodeURIComponent(u))}}catch(e){}
</script></body></html>
